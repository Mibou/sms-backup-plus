apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId 'com.zegoggles.smssync'
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 1602
        versionName '1.6.0-BETA2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystoreProperties.isEmpty() ? null : signingConfigs.release
        }
    }

    lintOptions {
        // http://google.github.io/android-gradle-dsl/current/com.android.build.gradle.internal.dsl.LintOptions.html#com.android.build.gradle.internal.dsl.LintOptions
        warningsAsErrors true
    }

    //  avoid "Duplicate files copied in APK META-INF/"
    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }

    testOptions {
        unitTests {
            // Robolectric (4.4+) reads the merged binary resources
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'com.squareup:otto:1.3.8'
    implementation 'com.github.jberkel.k-9:k9mail-library:eaf689025e'
    implementation 'com.android.billingclient:billing:2.1.0'
    implementation 'androidx.work:work-runtime:2.3.4'
    implementation 'androidx.concurrent:concurrent-futures:1.0.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'androidx.core:core-role:1.0.0-beta01'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation "com.google.truth:truth:0.39"
    testImplementation 'org.mockito:mockito-all:1.10.17'
    testImplementation 'androidx.work:work-testing:2.3.4'

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.0-rc4'
}

tasks.withType(JavaCompile).configureEach {
    // configureEach (lazy) so this wins over the encoding AGP sets on its compile tasks
    options.encoding = 'UTF-8'
    if (!it.name.toLowerCase().contains('test')) {
        // -Xlint:deprecation is intentionally omitted: compiling against newer SDKs flags
        // framework APIs (AsyncTask, Service.stopForeground(boolean), ...) whose migration is
        // out of scope here. -Werror is kept for unchecked warnings.
        options.compilerArgs = ['-Werror', '-Xlint:unchecked']
    }
}